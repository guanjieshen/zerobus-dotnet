syntax = "proto2";

package databricks.zerobus.test;

option csharp_namespace = "Databricks.Zerobus.TestProto";

// A simple flat record type used to exercise protobuf ingestion and descriptor building.
message AirQuality {
  optional string device_name = 1;
  optional int32 temp = 2;
  optional int64 humidity = 3;
}
