name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # MinVer needs full history + tags to compute the version

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal

      - name: Pack (verify the package builds)
        run: dotnet pack src/Databricks.Zerobus.Sdk/Databricks.Zerobus.Sdk.csproj -c Release --no-build -o artifacts

      - name: Consumer smoke test (install the package and compile against it)
        shell: bash
        run: |
          version=$(ls artifacts/Databricks.Zerobus.Sdk.*.nupkg | sed -E 's/.*Sdk\.(.*)\.nupkg/\1/')
          echo "Testing package version: $version"
          tmp=$(mktemp -d)
          cat > "$tmp/nuget.config" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <add key="local" value="$(pwd)/artifacts" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          EOF
          cat > "$tmp/Consumer.csproj" <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Databricks.Zerobus.Sdk" Version="$version" />
            </ItemGroup>
          </Project>
          EOF
          cat > "$tmp/Program.cs" <<'EOF'
          using Databricks.Zerobus;
          IZerobusSdk sdk = new ZerobusSdk("h.zerobus.r.cloud.databricks.com", "https://x.cloud.databricks.com");
          var opt = new BulkWriterOptions { Parallelism = 4, BatchSize = 10_000 };
          var table = new TableProperties("main.telemetry.events");
          System.Console.WriteLine($"{table.TableName} {opt.Parallelism}");
          await sdk.DisposeAsync();
          EOF
          dotnet build "$tmp/Consumer.csproj" -c Release
